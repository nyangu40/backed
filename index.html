<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Bus Booking System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background-color: #f8f9fa;
      font-family: "Poppins", sans-serif;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    /* ========= HERO SECTION ========= */
    .hero {
      background: url('assets/bus hero.jpg') center/cover no-repeat;
      height: 70vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      color: white;
      padding: 20px;
      animation: fadeSlideUp 1.5s ease-out;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: bold;
      animation: textFade 2s ease-in-out;
    }

    .hero p {
      font-size: 1.2rem;
      margin-top: 10px;
      opacity: 0.9;
      animation: textFade 2.4s ease-in-out;
    }

    .btn-hero {
      margin-top: 20px;
      padding: 12px 30px;
      background: #007bff;
      border: none;
      color: white;
      border-radius: 30px;
      font-size: 1.1rem;
      transition: 0.3s;
      animation: fadeSlideUp 2.6s ease-in-out;
    }
    .btn-hero:hover {
      background: #0056b3;
      transform: scale(1.05);
    }

    /* ========= BUS CARDS ========= */
    .bus-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 15px;
      transition: 0.2s;
      animation: fadeSlideUp 1s ease-in-out;
    }
    .bus-card:hover {
      transform: scale(1.03);
    }

    footer {
      background-color: #007bff;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 40px;
    }

    /* ========= PAGE ANIMATIONS ========= */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes textFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

<body onload="document.body.style.opacity='1'; initHomePage();">

  <!-- ========== HEADER ========== -->
  <header class="bg-primary text-white text-center p-3">
    <h1>🎒 Student Bus Booking</h1>
    <nav>
      <a href="index.html" class="text-white mx-2">Home</a>
      <a href="#buses" class="text-white mx-2">Buses</a>
      <a href="login.html" class="text-white mx-2">Organizer</a>
    </nav>
  </header>

  <!-- ========== HERO SECTION ========== -->
  <section class="hero">
    <div class="hero-content">
      <h1>Welcome to Student Bus Booking</h1>
      <p>Your safe and convenient ride starts here.</p>
      <a href="#buses" class="btn btn-hero">Book a Seat</a>
    </div>
  </section>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="container mt-5">
    <h2 class="text-primary mb-4">🚌 Available Buses</h2>
    <div id="busContainer" class="row"></div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer>
    <p>© 2025 Student Bus Booking | Designed by GIFT</p>
  </footer>

  <script src="app.js"></script>

  <!-- Smooth Scroll -->
  <script>
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener("click", function(e) {
        e.preventDefault();
        document.querySelector(this.getAttribute("href")).scrollIntoView({
          behavior: "smooth"
        });
      });
    });
  </script>

</body>
</html>

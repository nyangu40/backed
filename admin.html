<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body onload="initAdminPage()">

  <header class="bg-primary text-white text-center p-3 mb-4">
    <h1>🛠️ Admin Dashboard</h1>
    <nav>
      <a href="index.html" class="text-white mx-2">Home</a>
      <a href="#addBus" class="text-white mx-2">Add Bus</a>
      <a href="#bookings" class="text-white mx-2">Bookings</a>
      <button id="logoutBtn" class="btn btn-light btn-sm float-end me-3">Logout</button>
    </nav>
  </header>

  <main class="container">
    <section id="addBus" class="mb-5">
      <h2 class="text-primary mb-3">➕ Add New Bus</h2>
      <form id="busForm" class="card p-4 shadow-sm" enctype="multipart/form-data">
        <div class="row">
          <div class="col-md-6 mb-3"><input type="text" name="bus_name" placeholder="Bus name" class="form-control" required /></div>
          <div class="col-md-6 mb-3"><input type="text" name="organizer" placeholder="Organizer" class="form-control" required /></div>
          <div class="col-md-6 mb-3"><input type="text" name="origin" placeholder="Origin" class="form-control" required /></div>
          <div class="col-md-6 mb-3"><input type="text" name="destination" placeholder="Destination" class="form-control" required /></div>
          <div class="col-md-6 mb-3"><input type="number" name="total_seats" placeholder="Total Seats" class="form-control" required /></div>
          <div class="col-md-6 mb-3"><input type="number" name="price" placeholder="Price" class="form-control" required /></div>
          <div class="col-md-6 mb-3"><input type="text" name="airtel_number" placeholder="Organizer Number" class="form-control" required /></div>
          <div class="col-md-6 mb-3"><input type="file" name="image" class="form-control" required /></div>
        </div>
        <button class="btn btn-success w-100" type="submit">Upload</button>
      </form>
      <div id="busMessage" class="mt-3 fw-bold"></div>
    </section>

    <section id="buses" class="mb-5">
      <h2 class="text-primary mb-3">🚌 Available Buses</h2>
      <div id="busContainer" class="row"></div>
    </section>

    <section id="bookings">
      <h2 class="text-success mb-3">📖 Bookings</h2>
      <div class="table-responsive">
        <table class="table table-striped table-bordered">
          <thead class="table-primary">
            <tr>
              <th>#</th><th>Student</th><th>Seat</th><th>Bus</th>
              <th>Organizer</th><th>Route</th><th>Amount</th>
              <th>Method</th><th>Payer</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="bookingTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="bg-primary text-white text-center p-3 mt-4">
    <p>© 2025 Student Bus Booking Admin</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
